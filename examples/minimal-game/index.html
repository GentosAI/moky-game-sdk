<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点点方块（蒙奇游戏接入示例）</title>
<!-- 1. 蒙奇游戏登录脚本：直接写在 HTML 里、放在 <head>、data-game 换成你自己的接入密钥（python3 scripts/moky.py key <你的游戏链接>） -->
<script src="https://clawapps.cn/sdk/moky.js" data-game="mk0000000000000000"></script>
<style>
  html,body{margin:0;height:100%;background:#16213a;color:#fff;font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #box{width:120px;height:120px;border-radius:20px;background:#ffb957;cursor:pointer;transition:transform .08s}
  #box:active{transform:scale(.92)}
  button{padding:12px 36px;border:0;border-radius:999px;background:#4fe6d3;color:#03262b;font-size:18px;font-weight:800}
  button:disabled{opacity:.45}
</style>
</head>
<body>
<div>得分 <b id="score">0</b></div>
<div id="box" hidden></div>
<button id="start" disabled>开始</button>
<p id="msg"></p>
<script src="./game.js"></script>
</body>
</html>
